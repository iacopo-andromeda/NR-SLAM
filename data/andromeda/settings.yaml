%YAML:1.0

# # Camera model
# Camera.model: "PinHole"

# # Camera calibration and distortion parameters
# Camera.fx: 461.91
# Camera.fy: 461.91
# Camera.cx: 341.0
# Camera.cy: 173.06


Camera.model: "DistortedPinHole"
Camera.fx: 461.91
Camera.fy: 461.91
Camera.cx: 341.0
Camera.cy: 173.06
Camera.k1: -0.339
Camera.k2: 1.848
Camera.p1: 0.01929
Camera.p2: 0.00561
Camera.k3: -6.387

Masking.filterFile: "./data/andromeda/filters.txt"

Visualization.cameraSize: 0.5

System.autoplay: 1
MapVisualizer.save_path = map_viz/
Evaluation.save_path = viz/
ImageVisualizer.save_path = eval/


# ---------------------------------------------------------------------------
# Tracking parameters
# ---------------------------------------------------------------------------

# Use every Nth frame only while in LOST bootstrap mode (1 disables skipping).

# Keep at most this many frames of lookback per feature track for triangulation.
Tracking.triangulation_track_lookback_frames: 5
Tracking.min_mappoint_distance: 0.02

# KLT optical-flow
Tracking.klt_window_size: 21
Tracking.klt_max_level: 4
Tracking.klt_max_iters: 10
Tracking.klt_epsilon: 0.0001
Tracking.klt_min_eig_th: 0.0001
Tracking.klt_min_SSIM: 0.65

# Insert a new keyframe after this many tracked frames.
Tracking.images_to_insert_keyframe: 10

# Remove a map point that has not been observed for this many frames.
Tracking.stale_mappoint_max_age_frames: 30

# Abort tracking (declare LOST) when fewer than this many points are tracked.
Tracking.min_tracked_points_abort: 8
Tracking.lost_bootstrap_frame_stride: 3
Tracking.lost_recovery_grace_frames: 5
Tracking.lost_recovery_min_tracked_points: 8

# Monocular map initializer (used for startup and LOST-mode re-bootstrap)
Tracking.monocular_initializer.klt_window_size: 21
Tracking.monocular_initializer.klt_max_level: 4
Tracking.monocular_initializer.klt_max_iters: 10
Tracking.monocular_initializer.klt_epsilon: 0.0001
Tracking.monocular_initializer.klt_min_eig_th: 0.0001
Tracking.monocular_initializer.klt_min_SSIM: 0.5
Tracking.monocular_initializer.rigid_max_features: 4000
Tracking.monocular_initializer.rigid_min_parallax: 0.999
Tracking.monocular_initializer.rigid_epipolar_threshold: 0.005

# ---------------------------------------------------------------------------
# Feature extraction parameters (Shi-Tomasi / goodFeaturesToTrack)
# ---------------------------------------------------------------------------

# Maximum number of corners to detect per frame.
Features.max_corners: 1000

# Minimum quality level relative to the best corner (0..1).
Features.quality_level: 0.1

# Minimum Euclidean distance between detected corners (pixels).
Features.min_distance: 7.0

MapVisualizer.left_view: !!opencv-matrix
